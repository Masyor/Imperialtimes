                content: `After the myriad of good news which flowed from Mendria’s campaign of attrition, these being constant physical victories fighting against the enemy of the God Emperor and then the medical victories. A sad new form of news is plaguing our Reporters desk, bad news. While bad news is, well, bad, it is important to show the wider Imperium that even our greatest Medicae workers make mistakes, and that's ok! Officio Medicae Master Za’hul Le’mendriaz’s miracle drug ‘Fervidus Sanguinious’, which allowed your average fighter like our glorious Imperial Guard, to fight and act like the heroes of the Imperium. It greatly improved their accuracy, health, stamina and more…However, after six Terran months of fighting, numerous companies have reported their peers combusting from the inside as they watch their bones quite literally melt. This of course is unsatisfactory and not efficient for wide spanning warfare, however, it was reported for five of those Terran months, the fighters took far more ground than normal and had far less injuries and mortalities. Since then, six regiments have fallen to the Drug and the General is asking for a case to be brought up against Le’mendriaz. The Administratum Officio Estate have brought together their greatest lawyers who have said ‘while the deaths of the Guards are unsavory, their lives before their deaths due to their drugs out preformed without, making the average one guardsmen worth six, therefore the Medical Malpractice case is hereby, nulled.’ The Medicae Officio will continue to give out the Fervidad Sanguinious whilst reportedly begin work on a much more stable variant.`

        function renderNewspaper() {
        const container = document.getElementById('main-content');
        container.innerHTML = '';

        issueData.forEach(story => {
            const article = document.createElement('article');
            
            // USE THE VARIABLE: If rowSpan exists, use it. Otherwise, default to 1.
            const spanClass = story.rowSpan ? `span-v-${story.rowSpan}` : '';
            article.className = `story ${story.type} ${spanClass}`;

            const len = story.title.length;
            let hSize;
            if (story.type === 'feature') hSize = len > 25 ? '38px' : '52px';
            else if (story.type === 'mid') hSize = len > 20 ? '28px' : '38px';
            else hSize = '24px';

            const paragraphs = story.content.split(/\n+/).filter(p => p.trim() !== '');
            const formattedContent = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');

            article.innerHTML = `
                <h2 style="font-size: ${hSize}">${story.title}</h2>
                <span class="byline">From: ${story.author}</span>
                <div class="content">
                    ${story.image ? `<figure class="article-image"><img src="${story.image}"></figure>` : ''}
                    ${formattedContent}
                </div>
            `;
            container.appendChild(article);
        });

        applyOrkJitter();
    }

        function applyOrkJitter() {
            document.querySelectorAll('.ork-writing').forEach(block => {
                const words = block.innerText.split(/\s+/);
                block.innerHTML = words.map(word => {
                    const rot = (Math.random() * 6 - 3).toFixed(2);
                    return `<span style="display:inline-block; transform:rotate(${rot}deg); margin-right:5px;">${word}</span>`;
                }).join('');
            });
        }

        function downloadNewspaper() {
            const btn = document.getElementById('download-btn');
            const paper = document.querySelector('.parchment');
            btn.style.display = 'none';

            html2canvas(paper, {
                backgroundColor: "#080808",
                scale: 2,
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Imperial-Times.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.style.display = 'block';
            });
        }

        window.onload = renderNewspaper;
